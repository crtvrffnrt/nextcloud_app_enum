id: nextcloud-anonymous-app-enumeration

info:
  name: Nextcloud anonymous app fingerprints
  author: local-audit
  severity: info
  description: Public capabilities indicate enabled providers; static assets indicate files only, not enablement. Missing matches do not mean an app is absent.
  tags: nextcloud,tech,enumeration

http:
  - method: GET
    path:
      - "{{BaseURL}}/ocs/v2.php/cloud/capabilities?format=json"
    headers:
      OCS-APIRequest: "true"
      Accept: application/json
    redirects: false
    matchers-condition: or
    matchers:
      - type: dsl
        name: capability-bookmarks
        dsl:
          - 'status_code == 200 && contains(content_type, "application/json") && regex("\"bookmarks\"\\s*:", body) && contains(body, "capabilities")'
      - type: dsl
        name: capability-calendar
        dsl:
          - 'status_code == 200 && contains(content_type, "application/json") && regex("\"calendar\"\\s*:", body) && contains(body, "capabilities")'
      - type: dsl
        name: capability-cookbook
        dsl:
          - 'status_code == 200 && contains(content_type, "application/json") && regex("\"cookbook\"\\s*:", body) && contains(body, "capabilities")'
      - type: dsl
        name: capability-theming
        dsl:
          - 'status_code == 200 && contains(content_type, "application/json") && regex("\"theming\"\\s*:", body) && contains(body, "capabilities")'
  - method: GET
    path:
      - "{{BaseURL}}/custom_apps/bookmarks/js/bookmarks-vendors-node_modules_rehype-highlight_index_js.js"
    redirects: false
    matchers:
      - type: dsl
        name: asset-bookmarks-custom_apps
        dsl:
          - 'status_code == 200 && contains(content_type, "javascript") && len(body) > 100'
  - method: GET
    path:
      - "{{BaseURL}}/apps/bookmarks/js/bookmarks-vendors-node_modules_rehype-highlight_index_js.js"
    redirects: false
    matchers:
      - type: dsl
        name: asset-bookmarks-apps
        dsl:
          - 'status_code == 200 && contains(content_type, "javascript") && len(body) > 100'
  - method: GET
    path:
      - "{{BaseURL}}/custom_apps/calendar/img/favicon.svg"
    redirects: false
    matchers:
      - type: dsl
        name: asset-calendar-custom_apps
        dsl:
          - 'status_code == 200 && contains(content_type, "svg") && contains(body, "<svg")'
  - method: GET
    path:
